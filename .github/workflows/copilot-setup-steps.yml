name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  MOONBIT_VERSION: "0.1.20261021"
  MOONBIT_EXPECTED_MOONC: "v0.10.17+093cb8f9c"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install pinned MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: moon version --all
      - name: Verify Moon version
        run: moon version --all | grep -F "moon $MOONBIT_VERSION ("
      - name: Verify compiler version
        run: moon version --all | grep -F "moonc $MOONBIT_EXPECTED_MOONC ("
      - name: Resolve exact dependencies
        run: moon update
            
