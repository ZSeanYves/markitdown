name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOONBIT_VERSION: "0.1.20260920"
  MOONBIT_EXPECTED_MOONC: "v0.10.14+7d59c7ec9"
  MOONBIT_NEW_NATIVE: "0"

jobs:
  core:
    name: MoonBit core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - name: Format and interfaces
        run: moon fmt --check && moon info && git diff --exit-code
      - name: Check without warnings
        run: moon check --target all --warn-list +73 --deny-warn
      - name: Check MoonX consumer tools
        run: |
          moon check tools/regression/moonx_smoke.mbtx
          moon check tools/regression/run_moonx_regression.mbtx
          moon check tools/regression/moonx_benchmark.mbtx
      - name: Native tests
        run: moon test --target native --no-parallelize
      - name: Wasm tests
        run: moon test --target wasm --no-parallelize
      - name: Build release artifacts
        run: moon build --target native --release --package ZSeanYves/markitdown && moon build --target wasm --release --package ZSeanYves/markitdown
