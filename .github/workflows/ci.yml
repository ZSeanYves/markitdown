name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOONBIT_ASYNC_CHECK_FD_LEAK: "1"
  MOONBIT_VERSION: "0.1.20261021"
  MOONBIT_INSTALL_VERSION: "0.10.17+093cb8f9c"
  MOONBIT_EXPECTED_MOONC: "v0.10.17+093cb8f9c"

jobs:
  core:
    name: MoonBit core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: X64
          - os: macos-15
            platform: macos-arm64
            arch: ARM64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Verify runner architecture
        run: test "$RUNNER_ARCH" = "${{ matrix.arch }}"
      - name: Install pinned MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: moon version --all
      - name: Verify Moon version
        run: moon version --all | grep -F "moon $MOONBIT_VERSION ("
      - name: Verify compiler version
        run: moon version --all | grep -F "moonc $MOONBIT_EXPECTED_MOONC ("
      - name: Resolve exact dependencies
        run: moon update
      - name: Check Native without warnings
        run: moon check --target native --warn-list +73 --deny-warn
      - name: Generate Native interfaces
        run: moon info
      - name: Verify formatting
        run: moon fmt --check
      - name: Verify generated files
        run: git diff --exit-code
      - name: Check Native acceptance scripts
        run: |
          moon check --target native tools/regression/run_native_regression.mbtx
          moon check --target native tools/regression/native_install.mbtx
          moon check --target native --warn-list +73 --deny-warn tools/regression/native_library_benchmark.mbtx
          moon run --target native tools/regression/native_library_benchmark.mbtx -- --self-test true
      - name: Native debug tests
        run: moon test --target native --no-parallelize
      - name: Native release tests
        run: moon test --target native --release --no-parallelize
      - name: Native debug build
        run: moon build --target native .
      - name: Native release build
        run: moon build --target native --release .
      - name: Install local CLI and run independent library consumer
        run: moon run --target native tools/regression/native_install.mbtx -- --source local --root "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/native-install"
      - name: Upload installation and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-install-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-install
          if-no-files-found: error
