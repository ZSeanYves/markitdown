name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TZ: "UTC"
  LANG: "en_US.UTF-8"
  LC_ALL: "en_US.UTF-8"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MARKITDOWN_QUALITY_LAB_SHA: "eb80a4a3ccc8ca2fa6b39816789a854ba2c20d2c"
  MOONBIT_VERSION: "0.1.20260920"
  MOONBIT_EXPECTED_MOONC: "v0.10.14+7d59c7ec9"
  MOONBIT_NEW_NATIVE: "0"

  # The installer currently exposes a versioned latest artifact rather than a
  # stable historical URL. The governance check makes a toolchain drift fail
  # deliberately so updating this pin is an explicit reviewable change.

jobs:
  governance:
    name: Phase 0 governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain pin
        run: moon run tools/governance/check_toolchain.mbtx
      - name: Verify toolchain parser
        run: moon run tools/governance/check_toolchain.mbtx --self-test
      - name: Verify baseline inputs
        run: python3 tools/governance/collect_baseline.py --check
      - name: Verify Phase 1 architecture boundaries
        run: python3 tools/governance/check_architecture.py
      - name: Verify maintained documentation
        run: python3 tools/governance/check_documentation.py
      - name: Verify Phase 2 compatibility manifest
        run: python3 tools/compatibility/check_contract_manifest.py
      - name: Run governance tests
        run: |
          python3 -m unittest discover -s tools/governance/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/compatibility/tests -p 'test_*.py'
      - name: Verify PR policy
        if: github.event_name == 'pull_request'
        run: python3 tools/governance/check_pr_policy.py --event-path "$GITHUB_EVENT_PATH"

  core:
    name: MoonBit core (${{ matrix.os }})
    needs: governance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain pin
        run: moon run tools/governance/check_toolchain.mbtx
      - run: moon update
      - name: Format
        run: moon fmt --check
      - name: Interfaces
        run: moon info && git diff --exit-code
      - name: Check
        run: moon check --target all --warn-list +73
      - name: Test
        run: moon test --target all

  tooling:
    name: Python and shell tools
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Shell syntax
        run: find tools -type f -name '*.sh' -print0 | xargs -0 bash -n
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./tools
          check_together: true
      - name: Python syntax and tests
        run: |
          find tools -type f -name '*.py' -print0 | xargs -0 python3 -m py_compile
          python3 -m unittest discover -s tools/env/lib/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/regression/lib/tests -p 'test_*.py'
  coverage:
    name: Coverage
    needs: [core, tooling]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain pin
        run: moon run tools/governance/check_toolchain.mbtx
      - run: moon update
      - name: Run coverage gate
        env:
          MARKITDOWN_COVERAGE_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          ./tools/regression/run_with_release_manifest.sh \
            --output .tmp/release/coverage.json \
            --artifact .tmp/coverage \
            -- moon run tools/regression/check_coverage.mbtx --enforce
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            .tmp/coverage
            .tmp/release/coverage.json
          if-no-files-found: error

  regression:
    name: ${{ matrix.name }}
    needs: [core, tooling]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Main regression (Linux)
            os: ubuntu-24.04
            command: check_balance.sh
            evidence: check
          - name: Main regression (macOS)
            os: macos-15
            command: check_balance.sh
            evidence: check
          - name: Quality regression
            os: ubuntu-24.04
            command: check_balance_quality.sh
            evidence: quality
          - name: Accurate Office regression
            os: ubuntu-24.04
            command: check_accurate.sh
            evidence: accurate
    env:
      MARKITDOWN_CLI: ${{ github.workspace }}/_build/native/debug/build/markitdown.exe
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ZSeanYves/markitdown-quality-lab
          path: markitdown-quality-lab
          ref: ${{ env.MARKITDOWN_QUALITY_LAB_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain pin
        run: moon run tools/governance/check_toolchain.mbtx
      - run: moon update
      - name: Build CLI
        run: moon build --target native --package ZSeanYves/markitdown
      - name: Run Phase 2 local compatibility lab
        run: python3 tools/compatibility/run_contract_lab.py --cli ./_build/native/debug/build/markitdown.exe
      - name: Run regression
        run: |
          ./tools/regression/run_with_release_manifest.sh \
            --output .tmp/release/${{ matrix.evidence }}.json \
            --artifact .tmp/${{ matrix.evidence }} \
            -- ./tools/regression/${{ matrix.command }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-${{ matrix.evidence }}-${{ matrix.os }}
          path: |
            .tmp/${{ matrix.evidence }}
            .tmp/release/${{ matrix.evidence }}.json
          if-no-files-found: error

  benchmark:
    name: Performance
    needs: [core, tooling]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ZSeanYves/markitdown-quality-lab
          path: markitdown-quality-lab
          ref: ${{ env.MARKITDOWN_QUALITY_LAB_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain pin
        run: moon run tools/governance/check_toolchain.mbtx
      - run: moon update
      - name: Install benchmark baseline
        run: ./tools/env/installers/install_bench_baseline_deps.sh
      - name: Build benchmark
        run: |
          moon build --target native --release --package ZSeanYves/markitdown
          moon build --target native --release --package ZSeanYves/markitdown/internal/bench_runner
      - name: Run Phase 2 upstream corpus comparison
        run: |
          python3 tools/compatibility/fetch_upstream_corpus.py
          python3 tools/compatibility/run_contract_lab.py \
            --cli ./_build/native/release/build/markitdown.exe \
            --upstream ./env/.venv-markitdown-bench/bin/markitdown \
            --upstream-corpus ./.tmp/compatibility/upstream-v0.1.7
      - name: Doctor
        run: _build/native/release/build/internal/bench_runner/bench_runner.exe doctor
      - name: Run benchmark
        run: |
          set -euo pipefail
          mkdir -p .tmp/bench-ci
          disk=512
          args=(--preset change-risk)
          if [[ "${{ github.event_name }}" == schedule ]]; then
            disk=4096
            args=(--preset official-external-compare)
            python3 tools/regression/mutation_smoke.py
          fi
          _build/native/release/build/internal/bench_runner/bench_runner.exe run \
            "${args[@]}" \
            --progress=json --keep-outputs=failures --max-disk-mb "$disk" \
            | tee .tmp/bench-ci/run.jsonl
          summary="$(tail -n 1 .tmp/bench-ci/run.jsonl | jq -er '.summary_json | select(type == "string" and length > 0)')"
          test -f "$summary"
          jq -e '
            .trust_status == "trusted" and
            .truth_summary.failed_cases == 0 and
            .gate_summary.rss.status == "pass" and
            (
              .gate_summary.performance.status == "pass" or
              (.preset == "change-risk" and .gate_summary.performance.status == "not_applicable")
            )
          ' "$summary"
          cp "$summary" .tmp/bench-ci/summary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark
          path: |
            .tmp/bench-ci
            .tmp/bench/runs
            .tmp/mutation
          if-no-files-found: ignore

  native-backend-canary:
    name: New native full suite (${{ matrix.os }})
    needs: governance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      MOONBIT_NEW_NATIVE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Report toolchain
        run: moon version --all
      - run: moon update
      - name: Check new native backend
        run: moon check --target all --warn-list +73
      - name: Test complete new native package suite
        run: moon test --target native --no-parallelize
