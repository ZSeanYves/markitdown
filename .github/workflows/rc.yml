name: MoonX release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact published markitdown version, without @"
        required: true
        default: "0.8.0"
        type: string
      target:
        description: "MoonX target"
        required: true
        default: wasm
        type: choice
        options: [wasm, native]
      suite:
        description: "Regression suite"
        required: true
        default: all
        type: choice
        options: [main, quality, accurate, all]

permissions:
  contents: read

env:
  MARKITDOWN_QUALITY_LAB_SHA: "eb80a4a3ccc8ca2fa6b39816789a854ba2c20d2c"

jobs:
  moonx:
    name: MoonX RC (${{ inputs.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ZSeanYves/markitdown-quality-lab
          path: markitdown-quality-lab
          ref: ${{ env.MARKITDOWN_QUALITY_LAB_SHA }}
      - name: Install MoonBit and MoonX
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Run MoonX consumer smoke
        run: moonx tools/regression/moonx_smoke.mbtx "ZSeanYves/markitdown@${{ inputs.version }}" --target "${{ inputs.target }}"
      - name: Run MoonX regression
        run: moonx tools/regression/run_moonx_regression.mbtx "ZSeanYves/markitdown@${{ inputs.version }}" --target "${{ inputs.target }}" --suite "${{ inputs.suite }}"
      - name: Run MoonX performance sample
        run: moonx tools/regression/moonx_benchmark.mbtx "ZSeanYves/markitdown@${{ inputs.version }}" --target "${{ inputs.target }}"
      - name: Upload MoonX evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moonx-rc-${{ inputs.target }}-${{ inputs.version }}
          path: |
            .tmp/moonx-smoke
            .tmp/moonx-regression
            .tmp/moonx-benchmark
          if-no-files-found: warn
