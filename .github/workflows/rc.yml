name: Native release candidate

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Candidate installation source; this workflow does not publish"
        required: true
        default: local
        type: choice
        options: [local, git]
      git_url:
        description: "Repository URL for Git installation"
        required: true
        default: "https://github.com/ZSeanYves/markitdown.git"
        type: string
      revision:
        description: "Full 40-character Git commit SHA (required for source=git)"
        required: false
        type: string
      suite:
        description: "Regression suite"
        required: true
        default: all
        type: choice
        options: [main, quality, accurate, all]

permissions:
  contents: read

env:
  MOONBIT_ASYNC_CHECK_FD_LEAK: "1"
  MOONBIT_VERSION: "0.1.20261021"
  MOONBIT_INSTALL_VERSION: "0.10.17+093cb8f9c"
  MOONBIT_EXPECTED_MOONC: "v0.10.17+093cb8f9c"
  MARKITDOWN_QUALITY_LAB_SHA: "eb80a4a3ccc8ca2fa6b39816789a854ba2c20d2c"

jobs:
  native:
    name: Native RC (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: X64
          - os: macos-15
            platform: macos-arm64
            arch: ARM64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ZSeanYves/markitdown-quality-lab
          path: markitdown-quality-lab
          ref: ${{ env.MARKITDOWN_QUALITY_LAB_SHA }}
      - name: Verify runner architecture
        run: test "$RUNNER_ARCH" = "${{ matrix.arch }}"
      - name: Install pinned MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: moon version --all
      - name: Verify Moon version
        run: moon version --all | grep -F "moon $MOONBIT_VERSION ("
      - name: Verify compiler version
        run: moon version --all | grep -F "moonc $MOONBIT_EXPECTED_MOONC ("
      - name: Resolve exact dependencies
        run: moon update
      - name: Install local candidate and check public consumer
        if: inputs.source == 'local'
        run: moon run --target native tools/regression/native_install.mbtx -- --source local --root "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/native-install"
      - name: Install pinned Git candidate and check public consumer
        if: inputs.source == 'git'
        env:
          CANDIDATE_GIT_URL: ${{ inputs.git_url }}
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: moon run --target native tools/regression/native_install.mbtx -- --source git --root "$GITHUB_WORKSPACE" --git-url "$CANDIDATE_GIT_URL" --rev "$CANDIDATE_REVISION" --evidence "$RUNNER_TEMP/native-install"
      - name: Run contracts against installed Native executable
        env:
          REGRESSION_SUITE: ${{ inputs.suite }}
        run: moon run --target native tools/regression/run_native_regression.mbtx -- --binary "$(cat "$RUNNER_TEMP/native-install/installed-binary.txt")" --lab "$GITHUB_WORKSPACE/markitdown-quality-lab" --suite "$REGRESSION_SUITE" --evidence "$RUNNER_TEMP/native-regression"
      - name: Upload Native RC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-rc-${{ matrix.platform }}-${{ inputs.source }}
          path: |
            ${{ runner.temp }}/native-install
            ${{ runner.temp }}/native-regression
          if-no-files-found: error
